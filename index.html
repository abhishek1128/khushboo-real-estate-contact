  <style>
    :root {
      --bg:#f7f5f1; --card:#ffffff; --ink:#151515; --muted:#6b6b6b;
      --line:#e7e2da; --accent:#151515; --soft:#eee9e1;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
      font-family:Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display:flex; justify-content:center; align-items:center; padding:24px;
    }
    .card {
      width:min(100%, 430px); background:var(--card); border:1px solid var(--line);
      border-radius:28px; padding:30px 22px 22px; box-shadow:0 18px 60px rgba(0,0,0,.08);
    }
    .avatar {
      width:82px; height:82px; border-radius:50%; background:var(--ink); color:white;
      display:grid; place-items:center; font-size:30px; font-weight:700; margin:0 auto 18px;
      letter-spacing:-1px;
    }
    h1 { margin:0; text-align:center; font-size:28px; letter-spacing:-.8px; }
    .title { text-align:center; margin:7px 0 2px; font-weight:600; }
    .meta { text-align:center; color:var(--muted); font-size:14px; margin:0 0 24px; }
    .primary, .action {
      display:flex; align-items:center; justify-content:center; text-decoration:none;
      border-radius:15px; min-height:54px; font-weight:700; transition:.15s ease;
    }
    .primary { background:var(--accent); color:white; margin-bottom:12px; }
    .primary:active, .action:active { transform:scale(.985); }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .action { background:var(--soft); color:var(--ink); }
    .wide { grid-column:1 / -1; }
    .contact {
      margin:22px 0 18px; padding:16px; background:#faf9f7; border:1px solid var(--line);
      border-radius:18px; font-size:14px; line-height:1.7;
    }
    .contact a { color:var(--ink); text-decoration:none; overflow-wrap:anywhere; }
    .foot { color:var(--muted); text-align:center; font-size:12px; line-height:1.5; }
  </style>
</head>
